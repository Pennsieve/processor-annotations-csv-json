# yaml-language-server: $schema=https://schemas.pennsieve.io/app-manifest/v1.json
application:
  name: Annotation CSV to NDJSON
  description: >-
    Normalises an annotation export into the interchange NDJSON the TS-Zarr
    writer reads. Runs in a branch parallel to the signal conversion and emits
    one file per annotation source, which the writer turns into one event
    channel each.
  type: processor
  tags:
    - annotations
    - ndjson
    - timeseries
    - neurophysiology
    - ieeg
    - conversion

runtime:
  cpu: 1024
  memory: 2048
  computeTypes:
    - standard

inputs:
  - name: annotations
    required: true
    description: >-
      One or more CSV exports in INPUT_DIR. Every *.csv is read; the SITE
      setting decides which reader interprets them.

outputs:
  - name: annotations_ndjson
    description: >-
      One <channel.id>.annotations.ndjson per annotation source, written into
      OUTPUT_DIR. The stem is the channel id and must be unique across the
      whole workflow run: the branch merge flattens every output into one
      directory and fails on a filename collision.

parameters:
  - name: SITE
    label: Source site
    description: >-
      Which site's export rules to apply. Each site knows the quirks of one
      source; everything downstream of it is identical.
    type: string
    validValues:
      - ieeg
    defaultValue: ieeg
    required: false

  - name: DUPLICATE_RULE
    label: Repeated import rule
    description: >-
      How repeated imports of one mark are collapsed. exact keeps every copy
      that differs and collapses only identical ones, so no channel is ever
      dropped. first (oldest), last (newest) and widest (most channels) each
      keep one copy and discard the rest, which can lose channels the other
      copies named.
    type: string
    validValues:
      - exact
      - first
      - last
      - widest
    defaultValue: exact
    required: false

  - name: JSON_BODIES
    label: Structured bodies
    description: >-
      Write each mark's description and its source annotation id as a JSON
      body rather than plain text. Gives a migration an audit trail back to
      the row an annotation came from. Worth turning on for a source whose
      description only repeats its type, which would otherwise write empty
      bodies.
    type: boolean
    defaultValue: false
    required: false

  - name: SOURCE_PREFIX
    label: Channel id prefix
    description: >-
      Prepended to every channel id. Set it when a run merges annotations from
      more than one source, so two sites with a layer of the same name do not
      collide and fail the branch merge.
    type: string
    defaultValue: ""
    required: false
